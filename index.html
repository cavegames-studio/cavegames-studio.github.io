<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaVe Games</title>
  <meta name="description" content="CaVe Games">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5c6370;
      --border: #e2e0db;
      --accent: #2f8f5b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e8e6e3;
        --muted: #a0a6b0;
        --border: #30343b;
        --accent: #5cc48a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 2rem; margin: 0 0 4px; }
    .tagline { color: var(--muted); margin: 0 0 40px; }
    h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .game {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .game h3 { margin: 0 0 6px; font-size: 1.3rem; }
    .game p { margin: 0 0 12px; }
    .links a { margin-right: 16px; }
    a { color: var(--accent); }
    footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>CaVe Games</h1>

    <h2>Games</h2>

    <section class="game">
      <h3>CodeStep</h3>
      <p>Puzzle game for mobile.</p>
	  <p>Plan your route one step at a time, then press play and watch it run.</p>
      <p class="links">
        <a href="codestep/privacy.html">Privacy policy</a>
      </p>
    </section>

    <footer>
      Contact: <a href="mailto:cavegames.studio@proton.me">cavegames.studio@proton.me</a>
    </footer>
  </main>
</body>
</html>
